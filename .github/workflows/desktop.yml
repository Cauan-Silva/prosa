# Compila o Prosa para Windows (Tauri) numa máquina Windows do GitHub.
# - A cada push que mexe em desktop/: só confere se compila (o instalador fica nos "Artifacts").
# - Tag desktop-v* (ex.: desktop-v0.1.0): publica o instalador numa Release, e o botão
#   "Baixar para Windows" do site passa a baixar essa versão.
name: Programa para Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: testes do Rust
        working-directory: desktop/src-tauri
        run: cargo test --lib
      - name: dependências
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: compilar (e publicar, se for tag)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Prosa para Windows ${{ github.ref_name }}'
          releaseBody: 'Baixe o arquivo que termina em -setup.exe e abra para instalar.'
          releaseDraft: false
          prerelease: false
      - uses: actions/upload-artifact@v4
        with:
          name: prosa-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
